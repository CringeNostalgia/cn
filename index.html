<style>
  @property --p { syntax: "<length>"; inherits: false; initial-value: 0px; }

  html, body { margin: 0; height: 100%; background: #fff; color: #000; font-family: Georgia, "Times New Roman", Times, serif; }
  nav { position: fixed; top: 0; left: 0; right: 0; display: flex; justify-content: center; gap: 3rem; padding: 2rem; z-index: 10; }
  a, button.link { color: #000; text-decoration: none; font: inherit; font-size: 1.6rem; letter-spacing: 0.05em; background: none; border: 0; padding: 0; cursor: pointer; }
  a:hover, button.link:hover { text-decoration: underline; text-underline-offset: 4px; }
  main { height: 100%; display: flex; align-items: center; justify-content: center; }
  [hidden] { display: none !important; }

  #home img { max-width: 80vw; max-height: 75vh; display: block; }

  #list { display: flex; flex-direction: column; align-items: center; gap: 1.5rem; }

  #slideshow { flex-direction: column; align-items: center; gap: 1rem; }
  #stage { position: relative; width: 80vw; height: 72vh; cursor: pointer; }
  #stage img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }

  /* venetian blinds: horizontal slats open from the middle of each 40px band */
  #top {
    --p: 0px;
    -webkit-mask-image: repeating-linear-gradient(to bottom, transparent 0, transparent calc(20px - var(--p) / 2), #000 calc(20px - var(--p) / 2), #000 calc(20px + var(--p) / 2), transparent calc(20px + var(--p) / 2), transparent 40px);
            mask-image: repeating-linear-gradient(to bottom, transparent 0, transparent calc(20px - var(--p) / 2), #000 calc(20px - var(--p) / 2), #000 calc(20px + var(--p) / 2), transparent calc(20px + var(--p) / 2), transparent 40px);
  }
  #top.blinds { animation: blinds 1.1s ease-in-out forwards; }
  @keyframes blinds { from { --p: 0px; } to { --p: 40px; } }

  #counter { font-size: 1rem; letter-spacing: 0.1em; }
</style>

    <button class="link" id="open-001">001</button>

  </div>

  <div id="slideshow" hidden>
    <div id="stage" title="click for next">
      <img id="base" alt="">
      <img id="top" alt="">
    </div>
    <div id="counter"></div>

<script>
  // ---- exhibition 001 images (put them in the "images" folder in your repo) ----
  const FOLDER = "images/";
  const P = "20260930_dokumentacja_VictoriaNormal_TumanAtelier_internet";
  const pad = n => String(n).padStart(2, "0");
  const exhibition001 = [
    ...Array.from({length: 21}, (_, i) => `${P}${pad(i + 1)}.jpg`),   // internet01 ... internet21
    ...Array.from({length: 8},  (_, i) => `${P}_${pad(i + 2)}.jpg`),  // internet_02 ... internet_09
  ].map(f => FOLDER + f);

  const INTERVAL = 4000;

  const $ = id => document.getElementById(id);
  const home = $("home"), list = $("list"), show = $("slideshow");
  const base = $("base"), overlay = $("top"), counter = $("counter");

  let slides = [], index = 0, timer = null, busy = false;

  function view(name) {
    home.hidden = name !== "home";
    list.hidden = name !== "list";
    show.hidden = name !== "show";
    if (name !== "show") stop();
  }

  $("nav-exhibitions").onclick = () => view(list.hidden ? "list" : "home");
  $("open-001").onclick = () => start(exhibition001);

  function start(files) {
    slides = files; index = 0;
    base.src = slides[0];
    update();
    view("show");
    timer = setInterval(next, INTERVAL);
  }

  function stop() { clearInterval(timer); timer = null; }

  function update() { counter.textContent = pad(index + 1) + " / " + pad(slides.length); }

  function go(to) {
    if (busy) return;
    busy = true;
    const pre = new Image();
    pre.onload = pre.onerror = () => {
      overlay.src = slides[to];
      overlay.classList.add("blinds");
      overlay.onanimationend = () => {
        base.src = slides[to];
        overlay.classList.remove("blinds");
        index = to; update(); busy = false;
      };
    };
    pre.src = slides[to];
  }

  const next = () => go((index + 1) % slides.length);
  const prev = () => go((index - 1 + slides.length) % slides.length);

  $("stage").onclick = () => { next(); if (timer) { stop(); timer = setInterval(next, INTERVAL); } };

  document.addEventListener("keydown", e => {
    if (show.hidden) return;
    if (e.key === "ArrowRight") next();
    if (e.key === "ArrowLeft") prev();
    if (e.key === "Escape") view("list");
  });
</script>
