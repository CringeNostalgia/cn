<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tuman atelier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500&display=swap" rel="stylesheet">
<style>
  @property --p { syntax: "<length>"; inherits: false; initial-value: 0px; }

  html, body { margin: 0; height: 100%; background: #fff; color: #000; font-family: "Source Serif 4", Georgia, serif; font-weight: 500; }
  nav { position: fixed; top: 0; left: 0; right: 0; display: flex; justify-content: center; gap: 3rem; padding: 2rem; z-index: 10; }
  a, button.link { font-weight: 500; color: #000; text-decoration: none; font: inherit; font-size: 1.6rem; letter-spacing: 0.05em; background: none; border: 0; padding: 0; cursor: pointer; }
  a:hover, button.link:hover { text-decoration: underline; text-underline-offset: 4px; }
  main { height: 100%; display: flex; align-items: center; justify-content: center; }
  [hidden] { display: none !important; }

  #home img { max-width: 80vw; max-height: 75vh; display: block; }

  #list { display: flex; flex-direction: column; align-items: center; gap: 1.5rem; }

  #slideshow { display: flex; flex-direction: column; align-items: center; gap: 1rem; }
  #stage { position: relative; width: 80vw; height: 72vh; cursor: pointer; }
  #stage img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }

  /* venetian blinds: horizontal slats open from the middle of each 40px band */
  #top {
    --p: 0px;
    -webkit-mask-image: repeating-linear-gradient(to bottom, transparent 0, transparent calc(20px - var(--p) / 2), #000 calc(20px - var(--p) / 2), #000 calc(20px + var(--p) / 2), transparent calc(20px + var(--p) / 2), transparent 40px);
            mask-image: repeating-linear-gradient(to bottom, transparent 0, transparent calc(20px - var(--p) / 2), #000 calc(20px - var(--p) / 2), #000 calc(20px + var(--p) / 2), transparent calc(20px + var(--p) / 2), transparent 40px);
  }
  #top.blinds { animation: blinds 1.1s ease-in-out forwards; }
  @keyframes blinds { from { --p: 0px; } to { --p: 40px; } }

  #counter { font-size: 1rem; letter-spacing: 0.1em; }
</style>
</head>
<body>
<nav>
  <a href="#info">info</a>
  <button class="link" id="nav-exhibitions">exhibitions</button>
  <a href="#contact">contact</a>
</nav>

<main>
  <div id="home">
    <img src="logo.jpg" alt="tuman atelier floor plan">
  </div>

  <div id="list" hidden>
    <button class="link" id="open-001">001</button>
    <button class="link" id="open-002">002</button>
  </div>

  <div id="slideshow" hidden>
    <div id="stage" title="click for next">
      <img id="base" alt="">
      <img id="top" alt="">
    </div>
    <div id="counter"></div>
  </div>
</main>

<script>
  // ---- exhibition 001 images (same names as in the repo, in the root folder) ----
  const exhibition001 = [
    "20260930_dokumentacja_VictoriaNormal_TumanAtelier_internet01.jpg",
    "20260930_dokumentacja_VictoriaNormal_TumanAtelier_internet02.jpg",
    "20260930_dokumentacja_VictoriaNormal_TumanAtelier_internet03.jpg",
    "20260930_dokumentacja_VictoriaNormal_TumanAtelier_internet04.jpg",
    "20260930_dokumentacja_VictoriaNormal_TumanAtelier_internet05.jpg",
    "20260930_dokumentacja_VictoriaNormal_TumanAtelier_internet06.jpg",
    "20260930_dokumentacja_VictoriaNormal_TumanAtelier_internet07.jpg",
    "20260930_dokumentacja_VictoriaNormal_TumanAtelier_internet08.jpg",
    "20260930_dokumentacja_VictoriaNormal_TumanAtelier_internet09.jpg",
    "20260930_dokumentacja_VictoriaNormal_TumanAtelier_internet10.jpg",
    "20260930_dokumentacja_VictoriaNormal_TumanAtelier_internet11.jpg",
    "20260930_dokumentacja_VictoriaNormal_TumanAtelier_internet12.jpg",
    "20260930_dokumentacja_VictoriaNormal_TumanAtelier_internet13.jpg",
    "20260930_dokumentacja_VictoriaNormal_TumanAtelier_internet14.jpg",
    "20260930_dokumentacja_VictoriaNormal_TumanAtelier_internet15.jpg",
    "20260930_dokumentacja_VictoriaNormal_TumanAtelier_internet16.jpg",
    "20260930_dokumentacja_VictoriaNormal_TumanAtelier_internet17.jpg",
    "20260930_dokumentacja_VictoriaNormal_TumanAtelier_internet18.jpg",
    "20260930_dokumentacja_VictoriaNormal_TumanAtelier_internet19.jpg",
    "20260930_dokumentacja_VictoriaNormal_TumanAtelier_internet20.jpg",
    "20260930_dokumentacja_VictoriaNormal_TumanAtelier_internet21.jpg",
    "20260930_dokumentacja_VictoriaNormal_TumanAtelier_internet_02.jpg",
    "20260930_dokumentacja_VictoriaNormal_TumanAtelier_internet_03.jpg",
    "20260930_dokumentacja_VictoriaNormal_TumanAtelier_internet_04.jpg",
    "20260930_dokumentacja_VictoriaNormal_TumanAtelier_internet_05.jpg",
    "20260930_dokumentacja_VictoriaNormal_TumanAtelier_internet_06.jpg",
    "20260930_dokumentacja_VictoriaNormal_TumanAtelier_internet_07.jpg",
    "20260930_dokumentacja_VictoriaNormal_TumanAtelier_internet_08.jpg",
    "20260930_dokumentacja_VictoriaNormal_TumanAtelier_internet_09.jpg"
  ];

  const pad = n => String(n).padStart(2, "0");
  const INTERVAL = 4000;

  const $ = id => document.getElementById(id);
  const home = $("home"), list = $("list"), show = $("slideshow");
  const base = $("base"), overlay = $("top"), counter = $("counter");

  let slides = [], index = 0, timer = null, busy = false;

  function view(name) {
    home.hidden = name !== "home";
    list.hidden = name !== "list";
    show.hidden = name !== "show";
    if (name !== "show") stop();
  }

  $("nav-exhibitions").onclick = () => view(list.hidden ? "list" : "home");
  $("open-001").onclick = () => start(exhibition001);

  function start(files) {
    slides = files; index = 0;
    base.src = slides[0];
    update();
    view("show");
    timer = setInterval(next, INTERVAL);
  }

  function stop() { clearInterval(timer); timer = null; }

  function update() { counter.textContent = pad(index + 1) + " / " + pad(slides.length); }

  // if a photo can't be found, show which file the browser was looking for
  base.onerror = () => { counter.textContent = "can't load: " + base.getAttribute("src"); };

  function go(to) {
    if (busy) return;
    busy = true;
    const pre = new Image();
    pre.onload = pre.onerror = () => {
      overlay.src = slides[to];
      overlay.classList.add("blinds");
      overlay.onanimationend = () => {
        base.src = slides[to];
        overlay.classList.remove("blinds");
        index = to; update(); busy = false;
      };
    };
    pre.src = slides[to];
  }

  const next = () => go((index + 1) % slides.length);
  const prev = () => go((index - 1 + slides.length) % slides.length);

  $("stage").onclick = () => { next(); if (timer) { stop(); timer = setInterval(next, INTERVAL); } };

  document.addEventListener("keydown", e => {
    if (show.hidden) return;
    if (e.key === "ArrowRight") next();
    if (e.key === "ArrowLeft") prev();
    if (e.key === "Escape") view("list");
  });
</script>
</body>
</html>
